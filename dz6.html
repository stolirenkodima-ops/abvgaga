<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>StreamFlex</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #121212; color: white; }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 40px; 
            background: #181818; 
        }
        .nav-menu { display: flex; gap: 20px; }
        
        .container { display: flex; }
        
        aside { width: 200px; padding: 20px; background: #000; height: 100vh; }
        aside ul { list-style: none; padding: 0; }
        aside li { margin-bottom: 15px; }

        main { flex: 1; padding: 20px; }
        .grid-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
        }
        .card { 
            width: 200px; 
            height: 250px; 
            background: #333; 
            border-radius: 10px; 
            transition: transform 0.3s; 
            display: flex; justify-content: center; align-items: center;
        }
        .card:hover { transform: scale(1.05); background: #444; }

        @media (max-width: 768px) {
            aside { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎥 StreamFlex</div>
        <nav class="nav-menu">
            <div>Головна</div>
            <div>Фільми</div>
            <div>Серіали</div>
        </nav>
    </header>

    <div class="container">
        <aside>
            <h3>Меню</h3>
            <ul>
                <li>Моє</li>
                <li>Історія</li>
                <li>Налаштування</li>
            </ul>
        </aside>

        <main>
            <h2>Популярне сьогодні</h2>
            <div class="grid-container">
                <div class="card">Фільм 1</div>
                <div class="card">Фільм 2</div>
                <div class="card">Фільм 3</div>
                <div class="card">Фільм 4</div>
                <div class="card">Фільм 5</div>
                <div class="card">Фільм 6</div>
                <div class="card">Фільм 7</div>
                <div class="card">Фільм 8</div>
            </div>
        </main>
    </div>

</body>
</html>
